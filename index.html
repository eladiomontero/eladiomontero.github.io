<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eladio Montero-Porras · AI &amp; Game Theory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --serif: "Newsreader", Georgia, serif;
    --sans: "Hanken Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    /* defaults; overwritten by tweaks at runtime */
    --bg: #f4f0e7; --surface: #fffdf7; --ink: #221d16; --muted: #6f6557;
    --line: rgba(34,29,22,.12); --code: #8a7c66; --accent: #C0663F;
    --hero-font: var(--serif); --hero-weight: 500;
    --max: 1080px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; transition: background .4s ease, color .4s ease;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  /* ---- nav ---- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    max-width: var(--max); margin: 0 auto; padding: 18px 28px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px);
  }
  .nav-name { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .nav-name span { color: var(--accent); }
  .nav-links { display: flex; gap: 26px; font-size: 14.5px; }
  .nav-links a { color: var(--muted); transition: color .2s; }
  .nav-links a:hover { color: var(--ink); }
  @media (max-width: 620px) { .nav-links { gap: 16px; font-size: 13px; } }

  /* ---- reveal ---- */
  [data-reveal] { opacity: 0; transform: translateY(16px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  [data-reveal][data-shown] { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { [data-reveal] { opacity: 1; transform: none; transition: none; } }

  /* ---- hero ---- */
  .hero {
    display: grid; grid-template-columns: 1.55fr 1fr; gap: 60px; align-items: center;
    padding: 56px 0 96px; min-height: 78vh;
  }
  .eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: var(--accent);
    text-transform: uppercase; margin: 0 0 20px; }
  h1.hero-name {
    font-family: var(--hero-font); font-weight: var(--hero-weight);
    font-size: clamp(42px, 6.6vw, 78px); line-height: .98; letter-spacing: -.03em;
    margin: 0 0 18px; text-wrap: balance;
  }
  .hero-tagline {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(20px, 2.7vw, 30px); line-height: 1.22; letter-spacing: -.008em;
    color: var(--ink); margin: 0 0 28px; max-width: 24ch; text-wrap: balance;
  }
  h1.display {
    font-family: var(--hero-font); font-weight: var(--hero-weight);
    font-size: clamp(34px, 5.4vw, 62px); line-height: 1.04; letter-spacing: -.02em;
    margin: 0 0 26px; text-wrap: balance;
  }
  .lede { font-size: 18.5px; color: var(--muted); max-width: 46ch; margin: 0 0 28px; line-height: 1.62; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
  .chip {
    font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 100px;
  }
  .link-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .linkbtn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14.5px; font-weight: 500; color: var(--ink);
    background: var(--surface); transition: transform .18s, border-color .18s, color .18s;
  }
  .linkbtn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
  .link-row.big .linkbtn { padding: 11px 18px; font-size: 15px; }

  .hero-photo { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .photo-wrap {
    position: relative; width: 100%; max-width: 280px; aspect-ratio: 1; border-radius: 22px;
    overflow: hidden; border: 1px solid var(--line); background: var(--surface);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.4);
  }
  .photo-wrap::after {
    content: ""; position: absolute; inset: 0; border-radius: 22px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); pointer-events: none;
  }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(1.02); }
  .photo-ph {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: repeating-linear-gradient(45deg, var(--surface), var(--surface) 9px, var(--bg) 9px, var(--bg) 18px);
  }
  .photo-fallback .photo-ph { display: flex; }
  .photo-name { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin: 0; letter-spacing: .02em; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; gap: 38px; padding-top: 30px; padding-bottom: 64px; min-height: 0; }
    .hero-photo { order: -1; align-items: flex-start; }
    .photo-wrap { max-width: 150px; border-radius: 18px; }
    .photo-name { display: none; }
  }

  /* ---- sections ---- */
  .section { padding: 78px 0; border-top: 1px solid var(--line); }
  .section.alt { background: var(--surface); border-radius: 26px; padding: 70px 44px; margin: 14px 0; border-top: none; }
  @media (max-width: 640px) { .section.alt { padding: 54px 22px; border-radius: 18px; } }

  .head { display: flex; gap: 20px; align-items: baseline; margin-bottom: 46px; }
  .head-n { font-family: var(--mono); font-size: 13px; color: var(--accent); padding-top: 4px; }
  .kicker { font-family: var(--mono); font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 3.6vw, 38px); letter-spacing: -.018em; margin: 0; line-height: 1.08; }

  /* ---- research ---- */
  .papers { display: flex; flex-direction: column; gap: 14px; }
  .paper {
    display: grid; grid-template-columns: 132px 1fr; gap: 24px; align-items: center;
    padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
    transition: transform .22s, border-color .22s, box-shadow .22s;
  }
  .paper:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: 0 20px 40px -28px rgba(0,0,0,.4); }
  .paper-thumb { aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
  .paper-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .paper-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 7px; margin-bottom: 8px; }
  .paper-meta .dot { opacity: .5; }
  .paper-body h3 { font-family: var(--serif); font-weight: 560; font-size: 21px; letter-spacing: -.01em; margin: 0 0 8px; line-height: 1.2; }
  .paper-body p { margin: 0 0 12px; color: var(--muted); font-size: 15.5px; max-width: 60ch; }
  .paper-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--accent); }
  @media (max-width: 560px) { .paper { grid-template-columns: 1fr; } .paper-thumb { max-width: 160px; } }

  .more { display: inline-flex; align-items: center; gap: 7px; margin-top: 26px; font-family: var(--mono); font-size: 13px; color: var(--muted); transition: color .2s; }
  .more:hover { color: var(--accent); }

  /* ---- projects grid ---- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card {
    padding: 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg);
    display: flex; flex-direction: column; gap: 12px; transition: transform .22s, border-color .22s;
  }
  .section.alt .card { background: var(--bg); }
  .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .card-tag { font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); }
  .card h3 { font-family: var(--serif); font-weight: 560; font-size: 21px; margin: 0; letter-spacing: -.01em; line-height: 1.18; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  .card-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--accent); }

  /* ---- writing ---- */
  .posts { list-style: none; margin: 0; padding: 0; }
  .posts li { border-top: 1px solid var(--line); }
  .posts li:last-child { border-bottom: 1px solid var(--line); }
  .post { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding: 20px 4px; transition: padding-left .25s, color .25s; }
  a.post:hover { padding-left: 14px; color: var(--accent); }
  .post-title { font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
  .post-date { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }

  /* ---- reading shelf ---- */
  .shelf { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 620px) { .shelf { grid-template-columns: 1fr; } }
  .book {
    padding: 22px 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg);
    display: flex; flex-direction: column; gap: 6px; transition: transform .2s, border-color .2s;
  }
  .book:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .book-status { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .book h3 { font-family: var(--serif); font-weight: 560; font-size: 19px; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
  .book p { margin: 0; color: var(--muted); font-family: var(--mono); font-size: 13px; }

  /* ---- timeline ---- */
  .timeline { display: flex; flex-direction: column; }
  .tl-row { display: grid; grid-template-columns: 150px 1fr; gap: 28px; padding: 22px 0; border-top: 1px solid var(--line); }
  .tl-row:first-child { border-top: none; }
  .tl-period { font-family: var(--mono); font-size: 13px; color: var(--accent); padding-top: 3px; }
  .tl-main h3 { font-family: var(--sans); font-weight: 600; font-size: 18px; margin: 0 0 5px; }
  .tl-org { color: var(--muted); font-weight: 400; }
  .tl-main p { margin: 0; color: var(--muted); font-size: 15px; }
  @media (max-width: 560px) { .tl-row { grid-template-columns: 1fr; gap: 6px; } }

  /* ---- contact ---- */
  .contact { padding: 96px 0 0; border-top: 1px solid var(--line); }
  .contact .display { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 4.6vw, 50px); letter-spacing: -.02em; margin: 0 0 20px; line-height: 1.05; }
  .contact .lede { margin-bottom: 30px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 80px; padding: 26px 0; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--muted); }
  @media (max-width: 480px) { .foot { flex-direction: column; align-items: flex-start; gap: 8px; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="content.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
